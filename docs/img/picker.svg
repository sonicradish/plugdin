<svg xmlns="http://www.w3.org/2000/svg" width="640" height="322" viewBox="0 0 640 322" role="img" aria-label="Terminal showing: npx plugdin run claude, then an interactive menu listing the profiles dev, review, minimal, the built-in all and none baselines, and a Create a new Profile option.">
  <rect x="0.5" y="0.5" width="639" height="321" rx="10" fill="#16181d" stroke="#2f333d"/>
  <path d="M0 10a10 10 0 0 1 10-10h620a10 10 0 0 1 10 10v20H0z" fill="#1f222a"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="5" fill="#febc2e"/>
  <circle cx="56" cy="16" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#a9b1d6">
    <text x="18" y="62"><tspan fill="#565f89">$ </tspan><tspan fill="#c0caf5">npx plugdin run claude</tspan></text>

    <text x="18" y="104"><tspan fill="#9ece6a">? </tspan><tspan fill="#c0caf5">No --profile given. Pick one:</tspan><tspan fill="#565f89"> …</tspan></text>

    <text x="18" y="128" fill="#7dcfff">❯</text>
    <text x="38" y="128" fill="#7dcfff">dev (project)</text>

    <text x="38" y="152">review (project)</text>
    <text x="178" y="152" fill="#e0af68">— ⚠ 3 refusals, see `explain`</text>

    <text x="38" y="176">minimal (global)</text>

    <text x="38" y="200">all</text>
    <text x="70" y="200" fill="#565f89">— everything on (native default)</text>

    <text x="38" y="224">none</text>
    <text x="78" y="224" fill="#565f89">— everything off</text>

    <text x="38" y="248" fill="#bb9af7">Create a new Profile...</text>

    <text x="18" y="290" fill="#565f89">↑/↓ move · enter select</text>
  </g>
</svg>

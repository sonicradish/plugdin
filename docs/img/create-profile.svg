<svg xmlns="http://www.w3.org/2000/svg" width="700" height="466" viewBox="0 0 700 466" role="img" aria-label="Terminal showing the create-a-profile wizard: naming the profile writing, choosing project scope, choosing the none baseline, then a checklist of components toggled on or off, ending with the file written to .plugdin/profiles/writing.toml.">
  <rect x="0.5" y="0.5" width="699" height="465" rx="10" fill="#16181d" stroke="#2f333d"/>
  <path d="M0 10a10 10 0 0 1 10-10h680a10 10 0 0 1 10 10v20H0z" fill="#1f222a"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="5" fill="#febc2e"/>
  <circle cx="56" cy="16" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#a9b1d6">
    <text x="18" y="62"><tspan fill="#9ece6a">? </tspan><tspan fill="#c0caf5">Name for the new Profile</tspan><tspan fill="#565f89"> › </tspan><tspan fill="#7dcfff">writing</tspan></text>

    <text x="18" y="90"><tspan fill="#9ece6a">? </tspan><tspan fill="#c0caf5">Scope</tspan><tspan fill="#565f89"> …</tspan></text>
    <text x="18" y="114" fill="#7dcfff">❯</text>
    <text x="38" y="114" fill="#7dcfff">project</text>
    <text x="106" y="114" fill="#565f89">— .plugdin/profiles/ (committed, shared with the team)</text>
    <text x="38" y="138">global</text>
    <text x="106" y="138" fill="#565f89">— ~/.plugdin/profiles/ (just you, any project)</text>

    <text x="18" y="178"><tspan fill="#9ece6a">? </tspan><tspan fill="#c0caf5">Baseline</tspan><tspan fill="#565f89"> …</tspan></text>
    <text x="38" y="202">all</text>
    <text x="106" y="202" fill="#565f89">— start with everything on, then deny what you don't want</text>
    <text x="18" y="226" fill="#7dcfff">❯</text>
    <text x="38" y="226" fill="#7dcfff">none</text>
    <text x="106" y="226" fill="#565f89">— start with everything off, then allow what you want</text>

    <text x="18" y="266"><tspan fill="#9ece6a">? </tspan><tspan fill="#c0caf5">Toggle Components (starting from the baseline's state):</tspan></text>
    <text x="18" y="286" fill="#565f89">  space to toggle, enter to accept</text>

    <text x="38" y="316" fill="#9ece6a">◉</text>
    <text x="60" y="316" fill="#565f89">[skill]</text>
    <text x="168" y="316">tdd@skills-dir</text>

    <text x="18" y="340" fill="#7dcfff">❯</text>
    <text x="38" y="340" fill="#9ece6a">◉</text>
    <text x="60" y="340" fill="#565f89">[skill]</text>
    <text x="168" y="340" fill="#7dcfff">code-review@skills-dir</text>

    <text x="38" y="364">◯</text>
    <text x="60" y="364" fill="#565f89">[skill]</text>
    <text x="168" y="364">dataviz@skills-dir</text>

    <text x="38" y="388">◯</text>
    <text x="60" y="388" fill="#565f89">[plugin]</text>
    <text x="168" y="388">observability@acme</text>

    <text x="38" y="412" fill="#9ece6a">◉</text>
    <text x="60" y="412" fill="#565f89">[mcp-server]</text>
    <text x="168" y="412">linear-3f9c1a</text>

    <text x="18" y="446"><tspan fill="#9ece6a">✔ </tspan><tspan fill="#565f89">Wrote .plugdin/profiles/writing.toml — launching claude…</tspan></text>
  </g>
</svg>

name: Publish

# Publishes to npm when a GitHub Release is published. The release tag must match
# the version in package.json (with or without a leading "v").
#
# Authentication is npm Trusted Publishing (OIDC) — there is no NPM_TOKEN secret.
# npmjs.com must have this repository and this workflow filename registered as a
# trusted publisher for the package. See docs/releasing.md.
#
# Renaming this file breaks publishing until the trusted publisher is updated.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC auth and provenance attestation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; the runner ships an older npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing pluggedin@$pkg_version"

      # prepublishOnly runs the build and the test suite before the tarball is made.
      - run: npm publish --provenance --access public
